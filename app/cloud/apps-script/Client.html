<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),views=['register','login','admin'];let draft=null,session=null,importedRows=[];
try{session=JSON.parse(localStorage.getItem('agri-session')||'null');}catch{localStorage.removeItem('agri-session');}
const provinces=[[10,'กรุงเทพมหานคร'],[11,'สมุทรปราการ'],[12,'นนทบุรี'],[13,'ปทุมธานี'],[14,'พระนครศรีอยุธยา'],[15,'อ่างทอง'],[16,'ลพบุรี'],[17,'สิงห์บุรี'],[18,'ชัยนาท'],[19,'สระบุรี'],[20,'ชลบุรี'],[21,'ระยอง'],[22,'จันทบุรี'],[23,'ตราด'],[24,'ฉะเชิงเทรา'],[25,'ปราจีนบุรี'],[26,'นครนายก'],[27,'สระแก้ว'],[30,'นครราชสีมา'],[31,'บุรีรัมย์'],[32,'สุรินทร์'],[33,'ศรีสะเกษ'],[34,'อุบลราชธานี'],[35,'ยโสธร'],[36,'ชัยภูมิ'],[37,'อำนาจเจริญ'],[38,'บึงกาฬ'],[39,'หนองบัวลำภู'],[40,'ขอนแก่น'],[41,'อุดรธานี'],[42,'เลย'],[43,'หนองคาย'],[44,'มหาสารคาม'],[45,'ร้อยเอ็ด'],[46,'กาฬสินธุ์'],[47,'สกลนคร'],[48,'นครพนม'],[49,'มุกดาหาร'],[50,'เชียงใหม่'],[51,'ลำพูน'],[52,'ลำปาง'],[53,'อุตรดิตถ์'],[54,'แพร่'],[55,'น่าน'],[56,'พะเยา'],[57,'เชียงราย'],[58,'แม่ฮ่องสอน'],[60,'นครสวรรค์'],[61,'อุทัยธานี'],[62,'กำแพงเพชร'],[63,'ตาก'],[64,'สุโขทัย'],[65,'พิษณุโลก'],[66,'พิจิตร'],[67,'เพชรบูรณ์'],[70,'ราชบุรี'],[71,'กาญจนบุรี'],[72,'สุพรรณบุรี'],[73,'นครปฐม'],[74,'สมุทรสาคร'],[75,'สมุทรสงคราม'],[76,'เพชรบุรี'],[77,'ประจวบคีรีขันธ์'],[80,'นครศรีธรรมราช'],[81,'กระบี่'],[82,'พังงา'],[83,'ภูเก็ต'],[84,'สุราษฎร์ธานี'],[85,'ระนอง'],[86,'ชุมพร'],[90,'สงขลา'],[91,'สตูล'],[92,'ตรัง'],[93,'พัทลุง'],[94,'ปัตตานี'],[95,'ยะลา'],[96,'นราธิวาส']];
const status=(text,error=false)=>{$('status').textContent=text;$('status').className=error?'error':'success';};
const call=(action,payload={})=>new Promise((resolve,reject)=>google.script.run.withSuccessHandler(result=>result&&result.ok?resolve(result):reject(new Error(result&&result.error||'ทำรายการไม่สำเร็จ'))).withFailureHandler(reject).api(action,{...payload,...(session?{sessionToken:session.sessionToken}:{})}));
function show(name){views.forEach(view=>$('view-'+view).hidden=view!==name);document.querySelectorAll('nav [data-view]').forEach(button=>button.disabled=button.dataset.view===name);}
function deviceToken(){let token=localStorage.getItem('agri-device-token');if(!token){const bytes=new Uint8Array(32);crypto.getRandomValues(bytes);token=[...bytes].map(value=>value.toString(16).padStart(2,'0')).join('');localStorage.setItem('agri-device-token',token);}return token;}
function formData(form){return Object.fromEntries(new FormData(form).entries());}
function escapeHtml(value){const node=document.createElement('div');node.textContent=String(value??'');return node.innerHTML;}
const currentProvince=()=>String($('admin-province').value||session?.provinceCode||'');
function parseCsv(text){const lines=text.replace(/^\uFEFF/,'').split(/\r?\n/).filter(line=>line.trim()),cells=line=>{const out=[];let value='',quoted=false;for(let i=0;i<line.length;i++){const c=line[i];if(c==='"'&&quoted&&line[i+1]==='"'){value+='"';i++;}else if(c==='"')quoted=!quoted;else if(c===','&&!quoted){out.push(value.trim());value='';}else value+=c;}out.push(value.trim());return out;};if(lines.length<2)return[];const headers=cells(lines[0]);return lines.slice(1).map(line=>Object.fromEntries(cells(line).map((value,index)=>[headers[index],value])));}
function renderPreview(rows){$('import-preview').hidden=false;$('import-preview').textContent=`พร้อมนำเข้า ${rows.length.toLocaleString('th-TH')} แถว · จังหวัด ${currentProvince()}`;}
function selectedIds(){return[...document.querySelectorAll('[data-hotspot]:checked')].map(input=>input.dataset.hotspot);}
provinces.forEach(([code,name])=>$('province-code').add(new Option(name,String(code))));
document.querySelectorAll('[data-view]').forEach(button=>button.onclick=()=>show(button.dataset.view));
function selectRoleTab(role){const admin=role!=='owner';$('tab-admin').setAttribute('aria-selected',String(admin));$('tab-owner').setAttribute('aria-selected',String(!admin));$('panel-admin').hidden=!admin;$('panel-owner').hidden=admin;(admin?document.querySelector('#admin-login [name="phone"]'):document.querySelector('#owner-login [name="username"]')).focus();}
$('tab-admin').onclick=()=>selectRoleTab('admin');$('tab-owner').onclick=()=>selectRoleTab('owner');
document.querySelectorAll('[data-cancel]').forEach(button=>button.onclick=()=>location.href=$('public-home').href);
$('registration').position.onchange=()=>{$('position-other-field').hidden=$('registration').position.value!=='อื่นๆ';};
$('registration').onsubmit=event=>{event.preventDefault();draft=formData(event.currentTarget);draft.idempotencyKey=crypto.randomUUID().replace(/-/g,'');draft.noticeVersion='2026-10-21.1';$('register-form-step').hidden=true;$('notice-step').hidden=false;status('โปรดอ่านประกาศและยืนยันด้วยตนเอง');};
$('confirm-registration').onclick=async()=>{try{if(!$('acknowledged').checked)throw new Error('กรุณาติ๊กช่องรับทราบก่อนยืนยัน');$('confirm-registration').disabled=true;const result=await call('register',{...draft,acknowledged:true});sessionStorage.setItem('agri-registration-key',draft.idempotencyKey);status('ส่งคำขอแล้ว เลขคำขอ '+result.requestId);}catch(error){$('confirm-registration').disabled=false;status(error.message,true);}};
$('admin-login').onsubmit=async event=>{event.preventDefault();try{const result=await call('login',{...formData(event.currentTarget),deviceToken:deviceToken()});session={sessionToken:result.sessionToken,...result.session,expiresAt:result.expiresAt};localStorage.setItem('agri-session',JSON.stringify(session));await enterAdmin();}catch(error){status(error.message,true);}};
$('owner-login').onsubmit=async event=>{event.preventDefault();try{const result=await call('login',formData(event.currentTarget));session={sessionToken:result.sessionToken,...result.session,expiresAt:result.expiresAt};localStorage.setItem('agri-session',JSON.stringify(session));await enterAdmin();}catch(error){status(error.message,true);}};
async function enterAdmin(){show('admin');document.querySelector('[data-view="admin"]').hidden=false;$('session-name').textContent=session.fullName;$('session-role').textContent=session.role==='superadmin'?'Super Admin':'Admin จังหวัด '+session.provinceCode;$('owner-tools').hidden=session.role!=='superadmin';document.querySelectorAll('.owner-only').forEach(node=>node.hidden=session.role!=='superadmin');const registry=await call('listProvinceRegistry');$('admin-province').innerHTML=registry.provinces.filter(row=>row.dataPlaneReady).map(row=>`<option value="${escapeHtml(row.provinceCode)}">${escapeHtml(row.provinceNameTH)} (${escapeHtml(row.status)})</option>`).join('');if(session.role!=='superadmin')$('admin-province').value=session.provinceCode;if(session.role==='superadmin')await loadRequests();await loadWorkspace();status('เข้าสู่ระบบแล้ว');}
async function loadRequests(){const result=await call('listRequests'),pending=result.requests.filter(request=>['pending','needs_revision'].includes(request.status));$('requests').innerHTML=pending.length?'<table><thead><tr><th>ชื่อ</th><th>ตำแหน่ง/สังกัด</th><th>จังหวัด</th><th>การพิจารณา</th></tr></thead><tbody>'+pending.map(request=>`<tr><td>${escapeHtml(request.fullName)}</td><td>${escapeHtml(request.position)}<br>${escapeHtml(request.affiliation)}</td><td>${escapeHtml(request.provinceCode)}</td><td><button data-decision="approved" data-request="${escapeHtml(request.requestId)}">อนุมัติ</button> <button data-decision="needs_revision" data-request="${escapeHtml(request.requestId)}">ขอแก้ไข</button> <button data-decision="rejected" data-request="${escapeHtml(request.requestId)}">ปฏิเสธ</button></td></tr>`).join('')+'</tbody></table>':'ไม่มีคำขอรอพิจารณา';document.querySelectorAll('[data-decision]').forEach(button=>button.onclick=async()=>{try{const decision=button.dataset.decision,reason=decision==='approved'?'':prompt('ระบุเหตุผล')||'';if(decision!=='approved'&&!reason)return;const value=await call('decideRequest',{requestId:button.dataset.request,decision,reason});if(value.activationCode)alert('รหัสเปิดใช้งานครั้งแรก: '+value.activationCode+'\nส่งให้เจ้าหน้าที่ผ่านช่องทางส่วนตัว');await loadRequests();status('บันทึกผลพิจารณาแล้ว');}catch(error){status(error.message,true);}});}
async function loadWorkspace(){const provinceCode=currentProvince();if(!provinceCode)return;const [summary,data]=await Promise.all([call('dashboard',{provinceCode}),call('listHotspots',{provinceCode})]);const labels={draft:'ฉบับร่าง',submitted:'ส่งตรวจ',approved:'อนุมัติแล้ว',published:'เผยแพร่',deleted:'ลบแล้ว'};$('dashboard').innerHTML=Object.entries(summary.counts).map(([key,value])=>`<div class="metric"><span>${labels[key]}</span><strong>${Number(value).toLocaleString('th-TH')}</strong></div>`).join('');$('hotspot-table').innerHTML=data.rows.length?'<table><thead><tr><th><span class="sr-only">เลือก</span></th><th>วันที่</th><th>อำเภอ</th><th>พิกัด</th><th>สถานะ</th></tr></thead><tbody>'+data.rows.slice().reverse().map(row=>`<tr><td><input type="checkbox" data-hotspot="${escapeHtml(row.hotspotId)}" aria-label="เลือก ${escapeHtml(row.hotspotId)}"></td><td>${escapeHtml(row.date)} ${escapeHtml(row.time)}</td><td>${escapeHtml(row.districtCode)}</td><td>${escapeHtml(row.latitude)}, ${escapeHtml(row.longitude)}</td><td><span class="status-chip">${escapeHtml(labels[row.workflowStatus]||row.workflowStatus)}</span></td></tr>`).join('')+'</tbody></table>':'ยังไม่มีข้อมูลในจังหวัดนี้';}
$('admin-province').onchange=()=>loadWorkspace().catch(error=>status(error.message,true));
$('reload-hotspots').onclick=()=>loadWorkspace().then(()=>status('โหลดข้อมูลล่าสุดแล้ว')).catch(error=>status(error.message,true));
$('hotspot-file').onchange=async event=>{try{const file=event.target.files[0];if(!file)return;const text=await file.text();importedRows=file.name.toLowerCase().endsWith('.json')?JSON.parse(text):parseCsv(text);if(!Array.isArray(importedRows)||!importedRows.length||importedRows.length>5000)throw new Error('ไฟล์ต้องมีข้อมูล 1–5,000 แถว');importedRows=importedRows.map(row=>({...row,provinceCode:String(row.provinceCode||currentProvince()),latitude:Number(row.latitude),longitude:Number(row.longitude)}));renderPreview(importedRows);status('อ่านไฟล์สำเร็จ กรุณาตรวจจำนวนก่อนบันทึก');}catch(error){importedRows=[];status(error.message,true);}};
$('save-hotspots').onclick=async()=>{try{const rows=importedRows.length?importedRows:JSON.parse($('hotspot-json').value);const result=await call('saveHotspots',{rows});importedRows=[];$('hotspot-file').value='';$('import-preview').hidden=true;await loadWorkspace();status('บันทึกฉบับร่างแล้ว '+result.saved+' รายการ');}catch(error){status(error.message,true);}};
async function runWorkflow(action,extra={}){try{const hotspotIds=selectedIds();if(!hotspotIds.length)throw new Error('กรุณาเลือกรายการ');await call(action,{provinceCode:currentProvince(),hotspotIds,...extra});await loadWorkspace();status('ดำเนินการสำเร็จ '+hotspotIds.length+' รายการ');}catch(error){status(error.message,true);}}
$('submit-hotspots').onclick=()=>runWorkflow('submitHotspots');$('approve-hotspots').onclick=()=>runWorkflow('approveHotspots');$('publish-hotspots').onclick=()=>runWorkflow('publishHotspots',{published:true});$('unpublish-hotspots').onclick=()=>runWorkflow('publishHotspots',{published:false});$('delete-hotspots').onclick=()=>{const reason=prompt('ระบุเหตุผลการลบ');if(reason)runWorkflow('deleteHotspots',{reason});};
$('logout').onclick=async()=>{try{await call('logout');}catch{}session=null;localStorage.removeItem('agri-session');document.querySelector('[data-view="admin"]').hidden=true;show('login');status('ออกจากระบบแล้ว');};
if(session&&session.expiresAt>Date.now())enterAdmin().catch(()=>$('logout').click());else{show(location.hash==='#login'?'login':'register');if(location.hash==='#login')selectRoleTab('admin');}
})();
</script>
